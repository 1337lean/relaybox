name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version: '1.25.x'
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Lint Markdown
        run: npx --yes markdownlint-cli2@0.20.0 README.md CONTRIBUTING.md SECURITY.md 'docs/*.md'
      - name: Vet
        run: go vet ./...
      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - name: Race and coverage tests
        run: go test -race -cover ./...
      - name: Fuzz smoke tests
        run: |
          go test ./internal/app -run '^$' -fuzz '^FuzzVerify$' -fuzztime=10s
          go test ./internal/store -run '^$' -fuzz '^FuzzRecovery$' -fuzztime=10s

  native:
    name: native (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version: '1.25.x'
          cache: true
      - run: go test ./...
      - run: go build ./cmd/relaybox

  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version: '1.25.x'
          cache: true
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Build image
        run: docker buildx build --load --tag relaybox:test .
      - name: Runtime and restart smoke test
        run: ./scripts/container-smoke.sh relaybox:test
      - name: Generate image SBOM
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: relaybox:test
          version: v0.73.0
          format: cyclonedx
          output: relaybox-image.cdx.json
          scan-type: image
      - name: Scan image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: relaybox:test
          version: v0.73.0
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          scan-type: image
      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: relaybox-image-sbom
          path: relaybox-image.cdx.json
          if-no-files-found: error
