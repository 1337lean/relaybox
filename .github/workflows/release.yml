name: release

on:
  push:
    tags: ['v*']

permissions:
  actions: read
  attestations: write
  contents: write
  id-token: write
  packages: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: '1.25.x'
          cache: false
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Set release image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME}" >>"$GITHUB_ENV"

      - name: Verify source
        run: |
          test -z "$(gofmt -l .)"
          npx --yes markdownlint-cli2@0.20.0 README.md CONTRIBUTING.md SECURITY.md 'docs/*.md'
          go vet ./...
          go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
          go test -race ./...
      - name: Validate release configuration
        uses: goreleaser/goreleaser-action@ec59f474b9834571250b370d4735c50f8e2d1e29 # v7.0.0
        with:
          distribution: goreleaser
          version: v2.17.0
          args: check
      - name: Build without publishing
        uses: goreleaser/goreleaser-action@ec59f474b9834571250b370d4735c50f8e2d1e29 # v7.0.0
        with:
          distribution: goreleaser
          version: v2.17.0
          args: release --skip=publish --clean
      - name: Verify archives, checksums, and version metadata
        run: ./scripts/verify-release.sh "${GITHUB_REF_NAME}"
      - name: Generate source SBOM
        run: |
          go run github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.10.0 mod \
            -json -output dist/relaybox-source.cdx.json
          sha256sum dist/relaybox-source.cdx.json >>dist/checksums.txt

      - name: Build release image locally
        run: |
          version=${GITHUB_REF_NAME#v}
          docker buildx build --load --build-arg "VERSION=$version" --tag "$IMAGE" .
          test "$(docker run --rm "$IMAGE" version)" = "relaybox $version"
      - name: Verify release image runtime and restart
        run: ./scripts/container-smoke.sh "$IMAGE"
      - name: Generate image SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          version: v0.73.0
          format: cyclonedx
          output: dist/relaybox-image.cdx.json
          scan-type: image
      - name: Scan release image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          version: v0.73.0
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          scan-type: image
      - name: Add image SBOM checksum
        run: |
          sha256sum dist/relaybox-image.cdx.json >>dist/checksums.txt
          (cd dist && sha256sum --check checksums.txt)
      - name: Preserve verified artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: relaybox-${{ github.ref_name }}-verified
          path: dist
          if-no-files-found: error

      # No publication occurs before this point. Every source, archive, image,
      # runtime, checksum, SBOM, and vulnerability check above must pass first.
      - name: Create draft release with verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.tar.gz dist/*.zip dist/checksums.txt \
            dist/relaybox-source.cdx.json dist/relaybox-image.cdx.json \
            --draft --generate-notes --title "$GITHUB_REF_NAME" --verify-tag
      - name: Attest archives, checksums, and SBOMs
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
            dist/*.cdx.json
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push verified image
        run: docker push "$IMAGE"
      - name: Resolve pushed image digest
        id: image
        run: |
          reference=$(docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}')
          digest=${reference##*@}
          test -n "$digest"
          echo "reference=$reference" >>"$GITHUB_OUTPUT"
          echo "digest=$digest" >>"$GITHUB_OUTPUT"
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Sign image with GitHub OIDC
        run: |
          cosign sign --yes "${{ steps.image.outputs.reference }}"
          cosign attest --yes \
            --predicate dist/relaybox-image.cdx.json \
            --type cyclonedx \
            "${{ steps.image.outputs.reference }}"
      - name: Attest image provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
